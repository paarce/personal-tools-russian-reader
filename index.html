<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruso — Mis clases</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=JetBrains+Mono:wght@400;500&family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
  .lcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
    padding:20px;box-shadow:var(--sh);transition:.2s;display:flex;flex-direction:column;gap:6px}
  .lcard:hover{box-shadow:var(--sh-h);transform:translateY(-2px);border-color:var(--accent)}
  .lcard h3{font-size:1.05rem;font-weight:700;color:var(--text)}
  .lcard .ru-title{font-family:var(--ru);font-size:1.5rem;color:var(--text)}
  .badge{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.05em;
    text-transform:uppercase;padding:2px 9px;border-radius:999px;align-self:flex-start}
  .badge.ia{background:var(--accent-l);color:var(--accent);border:1px solid #F5D5D5}
  .badge.profesor{background:#EDF5EE;color:var(--ok);border:1px solid #CFE6D5}
  .lmeta{font-family:var(--mono);font-size:.7rem;color:var(--muted);margin-top:auto;padding-top:8px}
  .ltemas{font-size:.78rem;color:var(--muted)}
  .filters{display:flex;gap:8px;justify-content:center;margin-bottom:22px;flex-wrap:wrap}
  .filters button{padding:7px 16px;border-radius:999px;border:1px solid var(--border);
    background:var(--card);font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer;
    font-family:var(--body);transition:.2s}
  .filters button:hover{border-color:var(--accent);color:var(--accent)}
  .filters button.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .stats{display:flex;gap:22px;justify-content:center;margin-bottom:26px;flex-wrap:wrap}
  .stat{text-align:center}
  .stat b{display:block;font-family:var(--ru);font-size:1.9rem;color:var(--accent);line-height:1.1}
  .stat span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
</style>
</head>
<body>
<div class="wrap wide">
  <header>
    <h1>Мои <span>уроки</span></h1>
    <div class="meta">Todas mis clases de ruso — con profesor y generadas</div>
  </header>

  <nav class="tabs">
    <a href="index.html" class="active">Clases</a>
    <a href="review.html">Repaso</a>
  </nav>

  <div class="stats" id="stats"></div>

  <div class="filters" id="filters">
    <button data-f="todas" class="active">Todas</button>
    <button data-f="ia">Generadas</button>
    <button data-f="profesor">Con profesor</button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">No hay clases en esta vista.</div>

  <footer>Ruso · sitio estático en GitHub Pages</footer>
</div>

<script src="assets/progress.js"></script>
<script>
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio',
             'agosto','septiembre','octubre','noviembre','diciembre'];
function fecha(iso){const[a,m,d]=iso.split('-');return `${+d} ${MESES[+m-1]} ${a}`;}

let LECCIONES=[], filtro='todas';

function render(){
  const grid=document.getElementById('grid');
  const list=LECCIONES.filter(l=>filtro==='todas'||l.origen===filtro);
  grid.innerHTML='';
  document.getElementById('empty').style.display=list.length?'none':'block';
  for(const l of list){
    const a=document.createElement('a');
    a.className='lcard';
    a.href=`lesson.html?id=${encodeURIComponent(l.id)}`;
    const titulo = l.origen==='ia'
      ? `<div class="ru-title">${l.titulo}</div>`
      : `<h3>${l.titulo}</h3>`;
    const extra = l.origen==='ia' && l.duracion_min ? ` · ${l.duracion_min} min` : '';
    a.innerHTML=`
      <span class="badge ${l.origen}">${l.origen==='ia'?'generada':'con profesor'}</span>
      ${titulo}
      <div class="ltemas">${(l.temas||[]).filter(Boolean).slice(0,3).join(' · ')||'&nbsp;'}</div>
      <div class="lmeta">${fecha(l.fecha)} · ${l.entradas} palabras${extra}</div>`;
    grid.appendChild(a);
  }
}

document.getElementById('filters').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  filtro=b.dataset.f;
  document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('active',x===b));
  render();
});

Promise.all([
  fetch('data/manifest.json').then(r=>r.json()),
  fetch('data/vocabulary.json').then(r=>r.json()).catch(()=>null)
]).then(([man,voc])=>{
  LECCIONES=man.lecciones;
  render();
  const gen=LECCIONES.filter(l=>l.origen==='ia').length;
  const s=voc?Progress.stats(voc.words):null;
  document.getElementById('stats').innerHTML=`
    <div class="stat"><b>${LECCIONES.length}</b><span>clases</span></div>
    <div class="stat"><b>${gen}</b><span>generadas</span></div>
    ${s?`<div class="stat"><b>${s.pendientes}</b><span>para repasar</span></div>
        <div class="stat"><b>${s.dominadas}</b><span>dominadas</span></div>`:''}`;
}).catch(e=>{
  document.getElementById('empty').style.display='block';
  document.getElementById('empty').textContent='No se pudo cargar data/manifest.json — '+e.message;
});
</script>
</body>
</html>
